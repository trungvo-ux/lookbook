# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: lookbook-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: LOOKBOOK_RATE_LIMIT_RPM
        value: "90"
